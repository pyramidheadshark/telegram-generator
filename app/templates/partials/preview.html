<div class="grid md:grid-cols-2 gap-6">
    <div class="bg-gray-50 rounded-lg p-4">
        <h3 class="text-lg font-semibold text-gray-700 mb-3 text-center">Оригинал</h3>
        <div class="relative">
            {% if original_image %}
            <img src="{{ original_image }}" alt="Оригинальный шаблон" class="preview-image mx-auto">
            {% else %}
            <div class="bg-gray-200 rounded-lg p-8 text-center">
                <svg class="w-16 h-16 mx-auto text-gray-400 mb-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"/>
                </svg>
                <p class="text-gray-500">Загрузите шаблон Word</p>
            </div>
            {% endif %}
        </div>
    </div>
    
    <div class="bg-accent-50 rounded-lg p-4 border-2 border-accent-200">
        <h3 class="text-lg font-semibold text-accent-700 mb-3 text-center">Результат</h3>
        <div class="relative">
            {% if generated_image %}
            <img src="{{ generated_image }}" alt="Сгенерированный документ" class="preview-image mx-auto">
            {% else %}
            <div class="bg-accent-100 rounded-lg p-8 text-center">
                <svg class="w-16 h-16 mx-auto text-accent-400 mb-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/>
                </svg>
                <p class="text-accent-600">Загрузите Excel файл</p>
            </div>
            {% endif %}
        </div>
    </div>
</div>

{% if has_data %}
<div class="mt-4 text-center">
    <button hx-post="/preview" 
            hx-target="#preview-container"
            hx-indicator="#loading-indicator"
            class="inline-flex items-center gap-2 bg-primary-600 hover:bg-primary-700 text-white font-medium py-2 px-4 rounded-lg transition">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/>
        </svg>
        Обновить предпросмотр
    </button>
</div>
{% endif %}
